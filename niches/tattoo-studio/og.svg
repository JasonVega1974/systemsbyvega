<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Static Rose Tattoo — ">
  <title>Static Rose Tattoo</title>
  <defs>
    <linearGradient id="tattoo-studio-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0b10"/>
      <stop offset="0.55" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#0b0a0e"/>
    </linearGradient>
    <radialGradient id="tattoo-studio-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#c42b3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c42b3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tattoo-studio-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#c42b3d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c42b3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#tattoo-studio-og-ground)"/>
  <rect width="1200" height="630" fill="url(#tattoo-studio-og-glow)"/>
  <rect width="1200" height="630" fill="url(#tattoo-studio-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#c42b3d"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="ui-monospace, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#a89d8d">BOISE, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Cormorant Unicase, Georgia, serif" font-size="96" font-weight="800" fill="#ede4d3">Static Rose Tattoo</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#c42b3d"/>

  <!-- tagline -->
  

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#ede4d3" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#c42b3d"/>
  <text x="116" y="584" font-family="ui-monospace, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#a89d8d">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="ui-monospace, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#c42b3d">$150-$1000+</text>
</svg>
