<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Osprey Moving Co. — Local moves, zero chaos.">
  <title>Osprey Moving Co.</title>
  <defs>
    <linearGradient id="moving-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3E9"/>
      <stop offset="0.55" stop-color="#F0E7D8"/>
      <stop offset="1" stop-color="#F8F3E9"/>
    </linearGradient>
    <radialGradient id="moving-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#2F6B4F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2F6B4F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moving-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#2F6B4F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2F6B4F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#moving-og-ground)"/>
  <rect width="1200" height="630" fill="url(#moving-og-glow)"/>
  <rect width="1200" height="630" fill="url(#moving-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#2F6B4F"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#6B6353">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Bevan, Georgia, serif" font-size="96" font-weight="800" fill="#2E2A24">Osprey Moving Co.</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#2F6B4F"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Mulish, system-ui, sans-serif" font-size="34" fill="#6B6353">Local moves, zero chaos.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#2E2A24" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#2F6B4F"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#6B6353">SYSTEMS BY VEGA</text>

  
</svg>
