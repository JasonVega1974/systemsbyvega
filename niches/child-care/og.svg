<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Huckleberry Sitters — Go out. Bedtime is handled.">
  <title>Huckleberry Sitters</title>
  <defs>
    <linearGradient id="child-care-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="0.55" stop-color="#FDF7EF"/>
      <stop offset="1" stop-color="#FFFDF9"/>
    </linearGradient>
    <radialGradient id="child-care-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#7A5BA6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7A5BA6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="child-care-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#7A5BA6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7A5BA6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#child-care-og-ground)"/>
  <rect width="1200" height="630" fill="url(#child-care-og-glow)"/>
  <rect width="1200" height="630" fill="url(#child-care-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#7A5BA6"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#7A6E5F">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Fredoka, Georgia, serif" font-size="96" font-weight="800" fill="#3A3128">Huckleberry Sitters</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#7A5BA6"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="34" fill="#7A6E5F">Go out. Bedtime is handled.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#3A3128" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#7A5BA6"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#7A6E5F">SYSTEMS BY VEGA</text>

  
</svg>
