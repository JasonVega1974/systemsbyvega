<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cascade &amp; Copper Plumbing — Fast, honest plumbing — Kuna to Boise.">
  <title>Cascade &amp; Copper Plumbing</title>
  <defs>
    <linearGradient id="plumbing-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.55" stop-color="#0D121C"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="plumbing-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#2E6FF2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E6FF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plumbing-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#2E6FF2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2E6FF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#plumbing-og-ground)"/>
  <rect width="1200" height="630" fill="url(#plumbing-og-glow)"/>
  <rect width="1200" height="630" fill="url(#plumbing-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#2E6FF2"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#8CA0BC">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Chivo, Georgia, serif" font-size="78" font-weight="800" fill="#EAF0FB">Cascade &amp; Copper</text>
  <text x="90" y="382.68" font-family="Chivo, Georgia, serif" font-size="78" font-weight="800" fill="#EAF0FB">Plumbing</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#2E6FF2"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Public Sans, system-ui, sans-serif" font-size="34" fill="#8CA0BC">Fast, honest plumbing — Kuna to Boise.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EAF0FB" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#2E6FF2"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#8CA0BC">SYSTEMS BY VEGA</text>

  
</svg>
