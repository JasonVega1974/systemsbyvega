<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DJ Pulse — High-energy electronic music with heart — built for the dance floor.">
  <title>DJ Pulse</title>
  <defs>
    <linearGradient id="dj-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041410"/>
      <stop offset="0.55" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="dj-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#2EE58A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2EE58A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dj-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#2EE58A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2EE58A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dj-og-ground)"/>
  <rect width="1200" height="630" fill="url(#dj-og-glow)"/>
  <rect width="1200" height="630" fill="url(#dj-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#2EE58A"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Montserrat, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#9CC9AE">YOUR CITY</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Montserrat, Georgia, serif" font-size="96" font-weight="800" fill="#EBFBF1">DJ Pulse</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#2EE58A"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Montserrat, system-ui, sans-serif" font-size="34" fill="#DCF2E5">High-energy electronic music with heart —</text>
  <text x="90" y="492" font-family="Montserrat, system-ui, sans-serif" font-size="34" fill="#DCF2E5">built for the dance floor.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EBFBF1" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#2EE58A"/>
  <text x="116" y="584" font-family="Montserrat, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#9CC9AE">SYSTEMS BY VEGA</text>

  
</svg>
