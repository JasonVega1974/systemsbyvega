  <text x="90" y="382.68" font-family="Big Shoulders Display, Georgia, serif" font-size="78" font-weight="800" fill="#f5efe3">Contracting</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#f5a623"/>

  <!-- tagline -->
  

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#f5efe3" opacity="0.16"/>

