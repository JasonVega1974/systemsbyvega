      <stop offset="0" stop-color="#1c160d"/>
      <stop offset="0.55" stop-color="#151109"/>
      <stop offset="1" stop-color="#151109"/>
    </linearGradient>
    <radialGradient id="contracting-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
