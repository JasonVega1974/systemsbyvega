<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cora Vale Fitness — ">
  <title>Cora Vale Fitness</title>
  <defs>
    <linearGradient id="personal-trainer-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f24"/>
      <stop offset="0.55" stop-color="#14181c"/>
      <stop offset="1" stop-color="#101316"/>
    </linearGradient>
    <radialGradient id="personal-trainer-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#FF5A2E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="personal-trainer-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#FF5A2E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#personal-trainer-og-ground)"/>
  <rect width="1200" height="630" fill="url(#personal-trainer-og-glow)"/>
  <rect width="1200" height="630" fill="url(#personal-trainer-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#FF5A2E"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#9B9B92">EAGLE, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Bebas Neue, Georgia, serif" font-size="96" font-weight="800" fill="#EDEDE6">Cora Vale Fitness</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#FF5A2E"/>

  <!-- tagline -->
  

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EDEDE6" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#FF5A2E"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#9B9B92">SYSTEMS BY VEGA</text>

  
</svg>
