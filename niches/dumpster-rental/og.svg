<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sawtooth Dumpster Co. — The price is the price.">
  <title>Sawtooth Dumpster Co.</title>
  <defs>
    <linearGradient id="dumpster-rental-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1812"/>
      <stop offset="0.55" stop-color="#0e1f18"/>
      <stop offset="1" stop-color="#08130e"/>
    </linearGradient>
    <radialGradient id="dumpster-rental-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dumpster-rental-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dumpster-rental-og-ground)"/>
  <rect width="1200" height="630" fill="url(#dumpster-rental-og-glow)"/>
  <rect width="1200" height="630" fill="url(#dumpster-rental-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#FFC400"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#A79C86">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Anybody, Georgia, serif" font-size="96" font-weight="800" fill="#F2E9D8">Sawtooth Dumpster Co.</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#FFC400"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#BFB39C">The price is the price.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#F2E9D8" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#FFC400"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#A79C86">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#FFC400">$299-$554</text>
</svg>
