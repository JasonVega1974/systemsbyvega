<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Black Anvil Fabrication — ">
  <title>Black Anvil Fabrication</title>
  <defs>
    <linearGradient id="metal-fabrication-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2027"/>
      <stop offset="0.55" stop-color="#14181d"/>
      <stop offset="1" stop-color="#0c0f12"/>
    </linearGradient>
    <radialGradient id="metal-fabrication-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="metal-fabrication-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#metal-fabrication-og-ground)"/>
  <rect width="1200" height="630" fill="url(#metal-fabrication-og-glow)"/>
  <rect width="1200" height="630" fill="url(#metal-fabrication-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#FF6B1A"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#96A3B1">CALDWELL, NAMPA &amp; THE TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Saira Condensed, Georgia, serif" font-size="78" font-weight="800" fill="#EDF1F5">Black Anvil</text>
  <text x="90" y="382.68" font-family="Saira Condensed, Georgia, serif" font-size="78" font-weight="800" fill="#EDF1F5">Fabrication</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#FF6B1A"/>

  <!-- tagline -->
  

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EDF1F5" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#FF6B1A"/>
  <text x="116" y="584" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#96A3B1">SYSTEMS BY VEGA</text>

  
</svg>
