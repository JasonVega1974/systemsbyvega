<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ironwood Collision Co. — Like it never happened.">
  <title>Ironwood Collision Co.</title>
  <defs>
    <linearGradient id="auto-body-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1622"/>
      <stop offset="0.55" stop-color="#16121A"/>
      <stop offset="1" stop-color="#16121A"/>
    </linearGradient>
    <radialGradient id="auto-body-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#B02E58" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B02E58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auto-body-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#B02E58" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B02E58" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#auto-body-og-ground)"/>
  <rect width="1200" height="630" fill="url(#auto-body-og-glow)"/>
  <rect width="1200" height="630" fill="url(#auto-body-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#B02E58"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#A79FB0">GEM COUNTY &amp; THE TREASURE VALLEY</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Sora, Georgia, serif" font-size="96" font-weight="800" fill="#F2EDF6">Ironwood Collision Co.</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#B02E58"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Inter Tight, system-ui, sans-serif" font-size="34" fill="#C9D1D9">Like it never happened.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#F2EDF6" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#B02E58"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#A79FB0">SYSTEMS BY VEGA</text>

  
</svg>
