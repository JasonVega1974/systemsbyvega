<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cinder Hog BBQ — Smoked All Night. Parked Near You.">
  <title>Cinder Hog BBQ</title>
  <defs>
    <linearGradient id="bbq-food-truck-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12100D"/>
      <stop offset="0.55" stop-color="#171310"/>
      <stop offset="1" stop-color="#0C0A08"/>
    </linearGradient>
    <radialGradient id="bbq-food-truck-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#E8590C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bbq-food-truck-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#E8590C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bbq-food-truck-og-ground)"/>
  <rect width="1200" height="630" fill="url(#bbq-food-truck-og-glow)"/>
  <rect width="1200" height="630" fill="url(#bbq-food-truck-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#E8590C"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#B09A7E">NAMPA &amp; BOISE, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Alfa Slab One, Georgia, serif" font-size="96" font-weight="800" fill="#F6EBD9">Cinder Hog BBQ</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#E8590C"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Nunito Sans, system-ui, sans-serif" font-size="34" fill="#E4D4BC">Smoked All Night. Parked Near You.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#F6EBD9" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#E8590C"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#B09A7E">SYSTEMS BY VEGA</text>

  
</svg>
