<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Sage &amp; Suds Bin Co. — Fresh bins, zero effort.">
  <title>Sage &amp; Suds Bin Co.</title>
  <defs>
    <linearGradient id="bin-cleaning-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFDFC"/>
      <stop offset="0.55" stop-color="#F3F8F5"/>
      <stop offset="1" stop-color="#FBFDFC"/>
    </linearGradient>
    <radialGradient id="bin-cleaning-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#0F8A6C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0F8A6C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bin-cleaning-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#0F8A6C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0F8A6C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bin-cleaning-og-ground)"/>
  <rect width="1200" height="630" fill="url(#bin-cleaning-og-glow)"/>
  <rect width="1200" height="630" fill="url(#bin-cleaning-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#0F8A6C"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#57685E">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Bricolage Grotesque, Georgia, serif" font-size="96" font-weight="800" fill="#1F3229">Sage &amp; Suds Bin Co.</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#0F8A6C"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Figtree, system-ui, sans-serif" font-size="34" fill="#57685E">Fresh bins, zero effort.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#1F3229" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#0F8A6C"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#57685E">SYSTEMS BY VEGA</text>

  
</svg>
