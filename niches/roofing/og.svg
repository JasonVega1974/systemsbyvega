<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Storm Ridge Roofing — Built for the next storm.">
  <title>Storm Ridge Roofing</title>
  <defs>
    <linearGradient id="roofing-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a121a"/>
      <stop offset="0.55" stop-color="#121B24"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
    <radialGradient id="roofing-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#B5541F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B5541F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roofing-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#B5541F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B5541F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#roofing-og-ground)"/>
  <rect width="1200" height="630" fill="url(#roofing-og-glow)"/>
  <rect width="1200" height="630" fill="url(#roofing-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#B5541F"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Overpass Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#6E8398">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Anton, Georgia, serif" font-size="96" font-weight="800" fill="#EDF2F6">Storm Ridge Roofing</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#B5541F"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Rubik, system-ui, sans-serif" font-size="34" fill="#8CA0B3">Built for the next storm.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EDF2F6" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#B5541F"/>
  <text x="116" y="584" font-family="Overpass Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#6E8398">SYSTEMS BY VEGA</text>

  
</svg>
