<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Kestrel Detail Co. — Showroom shine, curbside.">
  <title>Kestrel Detail Co.</title>
  <defs>
    <linearGradient id="car-detailing-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="0.55" stop-color="#0E131A"/>
      <stop offset="1" stop-color="#070A0E"/>
    </linearGradient>
    <radialGradient id="car-detailing-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#2DD4CE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="car-detailing-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#2DD4CE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2DD4CE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#car-detailing-og-ground)"/>
  <rect width="1200" height="630" fill="url(#car-detailing-og-glow)"/>
  <rect width="1200" height="630" fill="url(#car-detailing-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#2DD4CE"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Space Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#748799">BOISE &amp; THE TREASURE VALLEY</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Saira Condensed, Georgia, serif" font-size="96" font-weight="800" fill="#D9E6EF">Kestrel Detail Co.</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#2DD4CE"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Manrope, system-ui, sans-serif" font-size="34" fill="#9DB1C0">Showroom shine, curbside.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#D9E6EF" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#2DD4CE"/>
  <text x="116" y="584" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#748799">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#2DD4CE">$89-$329</text>
</svg>
