<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Grit &amp; Gleam Powerwashing — Grime today. Gleam by tonight.">
  <title>Grit &amp; Gleam Powerwashing</title>
  <defs>
    <linearGradient id="pressure-washing-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051620"/>
      <stop offset="0.55" stop-color="#071e29"/>
      <stop offset="1" stop-color="#03111a"/>
    </linearGradient>
    <radialGradient id="pressure-washing-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pressure-washing-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pressure-washing-og-ground)"/>
  <rect width="1200" height="630" fill="url(#pressure-washing-og-glow)"/>
  <rect width="1200" height="630" fill="url(#pressure-washing-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#22D3EE"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Space Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#8FB4C2">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Space Grotesk, Georgia, serif" font-size="78" font-weight="800" fill="#EAF7FB">Grit &amp; Gleam</text>
  <text x="90" y="382.68" font-family="Space Grotesk, Georgia, serif" font-size="78" font-weight="800" fill="#EAF7FB">Powerwashing</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#22D3EE"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Manrope, system-ui, sans-serif" font-size="34" fill="#CFE7EE">Grime today. Gleam by tonight.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EAF7FB" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#22D3EE"/>
  <text x="116" y="584" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#8FB4C2">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#22D3EE">$149-$329</text>
</svg>
