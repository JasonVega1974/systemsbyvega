<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations Command Center — Demo · Systems by Vega</title>
<meta name="description" content="An interactive demo of the operations, field-sales, and analytics platforms Jason Vega builds — dashboards, task boards, a searchable database with drill-down records, pipelines, a territory map, calendar, ROI calculator, and an LMS. All data is fictional.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00C8FF; --sky:#38BDF8; --green:#00D68F; --amber:#FFC13D; --red:#FF4757; --purple:#A78BFA; --orange:#FF7A45;
    --sidebar:238px; --topbar:56px; --mono:'DM Mono',ui-monospace,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --bg:#080C18; --bg-2:#0B1022; --surface:#0D1225; --surface-2:#121830; --surface-3:#182038;
    --hair:#1E2A45; --hair-2:#26324f; --text:#E8EEF8; --muted:#8A97B0; --faint:#5A6784;
    --shadow:0 20px 50px rgba(0,0,0,.5); --overlay:rgba(4,7,16,.66);
  }
  html[data-theme="light"]{
    --bg:#EEF2F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#E7EDF6;
    --hair:#D9E1EC; --hair-2:#C6D2E2; --text:#141B2C; --muted:#55627A; --faint:#8A97AE;
    --shadow:0 20px 50px rgba(20,28,48,.16); --overlay:rgba(20,28,48,.34);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3px;line-height:1.1}
  a{color:var(--cyan);text-decoration:none}
  .mono,.num{font-family:var(--mono)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  .clickable{cursor:pointer}

  /* topbar */
  .topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:40;display:flex;align-items:center;gap:13px;padding:0 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.5px}
  .brand .mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--green));color:#04121f;font-weight:800;font-size:15px}
  .brand small{display:block;font-family:'DM Mono';font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:1.2px;margin-top:1px}
  .demo-pill{margin-left:4px;font-family:var(--mono);font-size:10.5px;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent);padding:3px 9px;border-radius:20px;letter-spacing:.4px;white-space:nowrap}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .icon-btn:hover{color:var(--text);border-color:var(--cyan)}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .period{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .period select,.field{background:var(--surface-2);color:var(--text);border:1px solid var(--hair);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px}
  .field:focus{outline:none;border-color:var(--cyan)}
  .user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--sky));display:grid;place-items:center;color:#0b0f19;font-weight:700;font-size:12px}
  .back-link{font-size:12.5px;color:var(--muted)}.back-link:hover{color:var(--cyan)}

  /* sidebar */
  .sidebar{position:fixed;top:var(--topbar);left:0;bottom:0;width:var(--sidebar);z-index:30;overflow-y:auto;background:var(--bg-2);border-right:1px solid var(--hair);padding:14px 12px 30px}
  .nav-group{margin-bottom:15px}
  .nav-group h5{font-family:'DM Mono';font-size:10px;font-weight:500;color:var(--faint);letter-spacing:1.3px;padding:0 10px 7px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:500;font-size:13.5px;transition:.13s;user-select:none}
  .nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 16%,transparent),transparent);color:var(--text)}
  .nav-item.active svg{stroke:var(--cyan)}
  .nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--red);color:#fff;padding:1px 7px;border-radius:20px}

  main{margin-left:var(--sidebar);margin-top:var(--topbar);padding:22px 26px 60px;max-width:1520px}
  .page{display:none;animation:fade .25s ease}.page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h1{font-size:27px}.page-head p{color:var(--muted);font-size:13px;margin-top:3px}
  .page-head .tools{display:flex;gap:8px;flex-wrap:wrap}
  .crumb{font-size:12px;color:var(--faint);margin-bottom:3px}.crumb b{color:var(--muted)}

  /* buttons */
  .btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--hair);background:var(--surface-2);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.13s}
  .btn:hover{border-color:var(--cyan);color:var(--text)}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn-pri{background:linear-gradient(135deg,var(--cyan),var(--sky));border-color:transparent;color:#04121f}
  .btn-pri:hover{filter:brightness(1.07)}
  .btn-sm{padding:6px 10px;font-size:12px}

  /* kpi + panels */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--hair);border-radius:13px;padding:15px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
  .kpi.g::before{background:var(--green)}.kpi.a::before{background:var(--amber)}.kpi.r::before{background:var(--red)}.kpi.p::before{background:var(--purple)}.kpi.o::before{background:var(--orange)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-family:'Barlow Condensed';font-weight:800;font-size:29px;margin-top:5px;letter-spacing:.5px}
  .kpi .sub{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--muted)}
  .kpi.mini .val{font-size:22px}
  .delta{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:1px 6px;border-radius:5px}
  .delta.up{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
  .delta.dn{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:13px;padding:16px 17px;margin-bottom:18px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .panel-head h3{font-size:17px}.panel-head .hint{font-size:11.5px;color:var(--faint)}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
  .grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:1000px){.grid-2,.grid-2e{grid-template-columns:1fr}}
  .chart-wrap{position:relative;height:260px}.chart-wrap.sm{height:210px}

  .alerts{display:flex;flex-direction:column;gap:9px}
  .alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--hair);border-left:3px solid var(--amber)}
  .alert.red{border-left-color:var(--red)}.alert.green{border-left-color:var(--green)}
  .alert:hover{border-color:var(--hair-2)}
  .alert .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:6px;flex:none}
  .alert.red .dot{background:var(--red)}.alert.green .dot{background:var(--green)}
  .alert .t{font-weight:600;font-size:13px}.alert .d{font-size:12px;color:var(--muted);margin-top:1px}
  .alert time{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

  /* tables */
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .toolbar .search{flex:1;min-width:190px;position:relative}
  .toolbar .search input{width:100%;padding:8px 11px 8px 32px}
  .toolbar .search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
  .table-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  thead th{background:var(--surface-2);color:var(--muted);font-weight:600;text-align:left;padding:10px 13px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--hair);cursor:pointer;user-select:none;position:sticky;top:0}
  thead th .arw{opacity:.4;font-size:10px}thead th.sorted .arw{opacity:1;color:var(--cyan)}
  tbody td{padding:10px 13px;border-bottom:1px solid var(--hair)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.clickable:hover{background:var(--surface-2)}
  .lnk{color:var(--cyan);font-weight:600}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.3px}
  .pill.active,.pill.done,.pill.live{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
  .pill.onboarding,.pill.prog{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
  .pill.prospect,.pill.review,.pill.high{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent)}
  .pill.paused,.pill.todo,.pill.low,.pill.na{color:var(--faint);background:color-mix(in srgb,var(--faint) 16%,transparent)}
  .pill.med{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
  .pill.risk{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--muted)}
  .pager button{background:var(--surface-2);border:1px solid var(--hair);color:var(--text);border-radius:7px;padding:5px 10px;cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.board{grid-template-columns:1fr}}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-family:'Barlow Condensed';font-size:15px;letter-spacing:.3px}
  .col-head .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);padding:1px 8px;border-radius:20px}
  .col-head .sw{width:9px;height:9px;border-radius:3px}
  .task{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:11px 12px;margin-bottom:10px;cursor:pointer;transition:.13s}
  .task:hover{border-color:var(--cyan);transform:translateY(-1px)}
  .task .tt{font-weight:600;font-size:13px}
  .task .meta{display:flex;align-items:center;gap:8px;margin-top:8px}
  .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .who .a{width:19px;height:19px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--sky)}
  .task .tag{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}

  /* pipeline */
  .pipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
  .pcard{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:15px;cursor:pointer;transition:.13s}
  .pcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .pcard .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .pcard .pname{font-weight:700;font-size:15px;font-family:'Barlow Condensed';letter-spacing:.3px}
  .pcard .rail{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .stagebar{display:flex;gap:4px;margin:12px 0 9px}
  .seg{flex:1;height:7px;border-radius:3px;background:var(--surface-3)}
  .seg.done{background:var(--green)}.seg.now{background:var(--cyan)}.seg.risk{background:var(--red)}
  .pcard .nx{font-size:12px;color:var(--muted)}.pcard .nx b{color:var(--text);font-weight:600}
  .progline{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between}

  /* territory */
  .map-wrap{display:grid;grid-template-columns:11fr 3.4fr;gap:20px;align-items:start}
  @media(max-width:900px){.map-wrap{grid-template-columns:1fr}}
  .tilemap{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
  .tile{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--faint);background:var(--surface-3);transition:.12s}
  .tile.has{color:#04121f;cursor:pointer}.tile.has:hover{transform:scale(1.09);outline:2px solid var(--text)}
  .legend{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend .scale{display:flex;gap:3px}.legend .scale i{width:20px;height:11px;border-radius:2px;display:block}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cal-head h3{font-size:19px;min-width:150px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;padding:4px;letter-spacing:1px}
  .cal-cell{min-height:88px;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;padding:6px 7px;overflow:hidden}
  .cal-cell.mut{opacity:.4}.cal-cell.today{border-color:var(--cyan)}
  .cal-cell .dn{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600}
  .cal-ev{font-size:10.5px;padding:2px 6px;border-radius:5px;margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-ev.visit{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyan)}
  .cal-ev.launch{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
  .cal-ev.review{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
  .cal-ev.deadline{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}

  /* calculator */
  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:820px){.calc-grid{grid-template-columns:1fr}}
  .calc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .calc-row label{font-size:13px;color:var(--muted)}.calc-row input{width:130px;text-align:right}
  .calc-out{background:linear-gradient(180deg,var(--surface-2),var(--bg-2));border:1px solid var(--hair);border-radius:12px;padding:18px}
  .calc-out .big{font-family:'Barlow Condensed';font-weight:800;font-size:40px;color:var(--green)}.calc-out .big.neg{color:var(--red)}
  .calc-out .orow{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-top:1px dashed var(--hair)}
  .calc-out .orow span:last-child{font-family:var(--mono)}

  /* checklist / subtabs */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .subtab{padding:7px 13px;border-radius:8px;background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .subtab.active{background:color-mix(in srgb,var(--cyan) 15%,transparent);color:var(--text);border-color:transparent}
  .subpanel{display:none}.subpanel.active{display:block}
  .check{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
  .check .q{font-size:13.5px}
  .yn{display:flex;gap:6px}
  .yn button{border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);border-radius:7px;padding:5px 15px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
  .yn button.yes.on{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);border-color:transparent}
  .yn button.no.on{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);border-color:transparent}

  /* training */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
  .course{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px;cursor:pointer;transition:.14s}
  .course:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .course .ci{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;margin-bottom:11px;background:var(--surface-3)}
  .course h4{font-size:16px}.course .cm{font-size:12px;color:var(--muted);margin:3px 0 12px}
  .prog{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
  .course .pl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:7px}
  .cbadge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:10px}
  .cbadge.done{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
  .cbadge.prog{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent)}

  /* drawer */
  .overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--bg-2);border-left:1px solid var(--hair);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.7,.3,1);overflow-y:auto;box-shadow:var(--shadow)}
  .drawer.open{transform:none}
  .dw-head{position:sticky;top:0;background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--hair);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
  .dw-head .eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:.6px;text-transform:uppercase}
  .dw-head h2{font-size:22px;margin-top:2px}
  .dw-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .dw-close{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:16px;flex:none}
  .dw-close:hover{color:var(--text);border-color:var(--red)}
  .dw-body{padding:18px 20px 40px}
  .mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
  .mini-kpi{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:11px 12px}
  .mini-kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

function exportCSV(filename,cols,rows){
  var head=cols.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',');
  var body=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var blob=new Blob([head+'\n'+body],{type:'text/csv'});var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  toast('Exported '+filename,'ok');
}

var SCHEMAS={
  sites:[['id','string'],['name','string'],['type','enum'],['mgr','string'],['city','string'],['state','string'],['status','enum'],['gal','number'],['rev','number'],['score','number']],
  vendors:[['name','string'],['prog','string'],['pri','enum'],['spend','number'],['reb','number'],['sav','number'],['sites','number']],

};
function escLite(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hlJSON(obj){var j=escLite(JSON.stringify(obj,null,2));
  return j.replace(/("(\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?/g,function(m,str,_a,colon){
    var c='n';if(str){c=colon?'k':'s';}else if(/true|false|null/.test(m))c='b';
    return '<span class="'+c+'">'+m+'</span>';
  });
}
var FLAGS_DEF=[['new_dashboard','New dashboard layout','Roll out the redesigned KPI grid'],['csv_import','Bulk CSV import','Enable multi-file import in the database'],['ai_notes','AI visit summaries','Auto-summarize site-visit notes'],['dark_default','Dark mode by default','New users start in dark theme']];
definePage('devtools',
  '<div class="page-head"><div><h1>Developer Tools</h1><p>The builder side — mock API explorer, data schema, feature flags, and stack.</p></div></div>'+
  '<div class="grid-2e"><div class="panel"><div class="panel-head"><h3>API Explorer</h3><span class="hint">mock · client-side</span></div>'+
  '<div class="api-bar"><span class="method">GET</span><input class="field" id="apiPath" value="/api/v1/sites?state=TX"><button class="btn btn-pri btn-sm" id="apiRun">Run</button></div>'+
  '<div class="resp-meta" id="apiMeta"></div><pre class="code" id="apiOut">// press Run</pre></div>'+
  '<div class="panel"><div class="panel-head"><h3>Data Schema</h3></div><div class="subtabs" id="schemaTabs"></div><div id="schemaOut"></div></div></div>'+

  '<div class="sec-title">Stack</div><div class="badges"><span class="sbadge"><b>Vanilla JS</b></span><span class="sbadge"><b>Chart.js</b> 4.4</span><span class="sbadge"><b>Vercel</b></span><span class="sbadge"><b>Supabase</b></span><span class="sbadge"><b>Stripe</b></span><span class="sbadge"><b>Brevo</b></span></div>'+

      var ds=m[1],qs=m[3]||'',params={};qs.split('&').forEach(function(p){if(p){var kv=p.split('=');params[kv[0]]=decodeURIComponent(kv[1]||'')}});
      var rows=ds==='sites'?SITES:ds==='vendors'?VENDORS:ds==='deals'?DEALS:null;
      if(!rows){$('#apiOut').textContent='// unknown collection: '+ds;$('#apiMeta').innerHTML='<span style="color:var(--red)">404 Not Found</span>';return;}
      var out=rows;
      if(params.state)out=out.filter(function(r){return (r.state||'').toUpperCase()===params.state.toUpperCase()});
      if(params.status)out=out.filter(function(r){return (r.status||'').toLowerCase()===params.status.toLowerCase()});
      var limited=out.slice(0,6).map(function(r){var o={};SCHEMAS[ds].forEach(function(f){o[f[0]]=r[f[0]]});return o});

    $$('#flagList .switch').forEach(function(sw){sw.onclick=function(){sw.classList.toggle('on');var f={};try{f=JSON.parse(localStorage.getItem('nw_flags')||'{}')}catch(e){}f[sw.dataset.f]=sw.classList.contains('on');try{localStorage.setItem('nw_flags',JSON.stringify(f))}catch(e){}toast('Flag '+(sw.classList.contains('on')?'enabled':'disabled')+' (demo)','ok')}});
    $('#pg-devtools').dataset.built='1';
  });
